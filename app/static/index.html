<!doctype html><html><head><meta charset="utf-8"><title>NL → Terraform</title><style>body{font:16px system-ui;background:#09111d;color:#e7eef8;max-width:1000px;margin:50px auto;padding:20px}textarea,pre{width:100%;box-sizing:border-box;background:#111e31;color:#d5e8ff;border:1px solid #2a486b;border-radius:12px;padding:16px}textarea{height:120px}button{margin:14px 0;padding:12px 20px;border:0;border-radius:99px;background:#6ee7b7;font-weight:700}pre{white-space:pre-wrap;min-height:160px}.ok{color:#6ee7b7}.bad{color:#fb7185}</style></head><body><h1>Natural Language → Terraform</h1><p>Generate scoped AWS infrastructure and validate it locally.</p><textarea id="q">I need an S3 bucket, a Lambda triggered on upload, and a DynamoDB table</textarea><button id="go">Generate</button><h2 id="status"></h2><pre id="code"></pre><script>go.onclick=async()=>{status.textContent='Validating…';const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:q.value})});const d=await r.json();code.textContent=d.terraform;status.textContent=d.validation.valid?'Validation passed':'Validation failed';status.className=d.validation.valid?'ok':'bad'}</script></body></html>
