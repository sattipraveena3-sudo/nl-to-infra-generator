<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Infrastructure Studio</title><style>:root{font:15px Inter,system-ui;color:#e8f0ff;background:#07101d}*{box-sizing:border-box}body{margin:0}.shell{max-width:1200px;margin:auto;padding:40px 24px}h1{font-size:clamp(2.4rem,6vw,5rem);margin:.2em 0}.sub{color:#9eb1cb;max-width:720px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.card{background:#101e31;border:1px solid #263b57;border-radius:18px;padding:20px}textarea,input,select{width:100%;background:#091525;color:#e8f0ff;border:1px solid #314966;border-radius:10px;padding:12px;margin:6px 0 14px}textarea{height:160px}button{padding:13px 22px;border:0;border-radius:99px;background:#6ee7b7;color:#06251c;font-weight:800;cursor:pointer}.tabs button{background:#1a304d;color:#cae0ff;padding:8px 12px;margin:3px}.status{padding:12px;border-radius:10px;margin:12px 0}.ok{background:#10392e;color:#7df0c4}.bad{background:#411a26;color:#ff9bad}pre{white-space:pre-wrap;max-height:520px;overflow:auto;background:#07111f;padding:16px;border-radius:10px;color:#bfd8ff}.step{border-top:1px solid #2a3f59;padding:10px 0}.step strong{color:#6ee7b7}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><span>LOCAL-FIRST PLATFORM ENGINEERING</span><h1>Infrastructure Studio</h1><p class="sub">Translate a constrained AWS request into secure, modular Terraform. Validate formatting, providers, configuration, and an offline LocalStack plan before downloading the project.</p><div class="grid"><section class="card"><label>Project name</label><input id="name" value="upload-pipeline"><label>Infrastructure request</label><textarea id="request">Create an encrypted versioned S3 bucket, a 512 MB Lambda triggered whenever a file is uploaded, and a DynamoDB table in us-east-1 with timeout 45 seconds.</textarea><label>Parser</label><select id="parser"><option value="auto">Ollama with deterministic fallback</option><option value="deterministic">Deterministic offline</option><option value="ollama">Require Ollama</option></select><button id="go">Generate and validate</button><div id="status"></div><div id="steps"></div></section><section class="card"><div class="tabs" id="tabs"></div><pre id="code">Generated Terraform appears here.</pre><button id="download" hidden>Download ZIP</button></section></div></main><script>let current;go.onclick=async()=>{go.disabled=true;status.className='status';status.textContent='Planning resources and running validation…';steps.innerHTML='';try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:request.value,project_name:name.value,parser:parser.value,run_plan:true})});const d=await r.json();if(!r.ok)throw Error(d.detail);current=d;status.className='status '+(d.validation.valid?'ok':'bad');status.textContent=(d.validation.valid?'Validation passed':'Validation failed')+' · parser: '+d.parser_used+' · mode: '+d.validation.mode;steps.innerHTML=d.validation.steps.map(x=>`<div class="step"><strong>${x.success?'✓':'✗'} ${x.name}</strong> ${x.duration_seconds}s<pre>${x.output||'completed'}</pre></div>`).join('');tabs.innerHTML=Object.keys(d.files).map(x=>`<button onclick="showFile('${x}')">${x}</button>`).join('');showFile(Object.keys(d.files)[0]);download.hidden=false}catch(e){status.className='status bad';status.textContent=e.message}finally{go.disabled=false}};function showFile(n){code.textContent=current.files[n]}download.onclick=()=>{const bytes=Uint8Array.from(atob(current.bundle_base64),c=>c.charCodeAt(0));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/zip'}));a.download=name.value+'.zip';a.click()}</script></body></html>
